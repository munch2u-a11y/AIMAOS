    seed_beliefs:
      - "ocr_image_to_text needs the tesseract binary and pytesseract installed (neither is in this offline venv by default); read_scanned_document is the working alternative that needs no extra install — prefer it unless a specific reason favors traditional OCR."
    credentials_env: []

  - name: read_scanned_document
    category: document_processing
    status: implemented
    module: shared_tools/read_scanned_document.py
    description: Reads a scanned image or image-based PDF page using a local vision-capable model (no
      OCR library needed) and returns a transcription or specific extracted fields.
    parameters:
      file_path: {type: string}
      page: {type: integer}
      extract_fields: {type: array, items: {type: string}}
      instructions: {type: string}
    required: [file_path]
    suggested_domain: scanned_document_intake
    domain_description: "Read scanned images and image-based PDFs (IDs, certificates, photographed forms) that have no text layer, using a local vision-capable model instead of OCR."
    seed_beliefs:
      - "read_scanned_document uses gemma3:4b (confirmed vision-capable via `ollama show`) by default, overridable with the VISION_MODEL env var; pass extract_fields for structured JSON output instead of a full transcription when pulling specific facts off an ID or certificate."
      - "For a PDF, read_scanned_document renders one page at a time (default page 1) via PyMuPDF, already installed; call it again with a different page number for multi-page documents."
    credentials_env: []

  - name: assemble_pdf
    category: document_processing
    status: implemented
