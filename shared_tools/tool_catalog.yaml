    parameters:
      datetime_str: {type: string}
      from_tz: {type: string}
      to_tz: {type: string}
    required: [datetime_str, from_tz, to_tz]
    suggested_domain: office_utilities
    domain_description: "Everyday math, unit, and timezone conversions for office work."
    seed_beliefs:
      - "timezone_convert wants full IANA names like 'America/New_York', not abbreviations like 'EST'; pass 'now' as datetime_str for the current time."
    credentials_env: []

