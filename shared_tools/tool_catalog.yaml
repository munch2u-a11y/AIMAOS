    parameters:
      expression: {type: string}
    required: [expression]
    suggested_domain: office_utilities
    domain_description: "Everyday math, unit, and timezone conversions for office work."
    seed_beliefs:
      - "calculator only accepts arithmetic and the functions sqrt/abs/round/min/max/floor/ceil/log/sin/cos/tan — no variable names beyond pi and e."
    credentials_env: []

