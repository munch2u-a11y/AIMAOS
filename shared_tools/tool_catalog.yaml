# AIMAOS Shared Tool Catalog
#
# Central reference for equipping any office agent with new capabilities —
# built for Zoe (tool_engineering domain) and Rae (agent_making domain) to
# consult when a task calls for a tool the target agent doesn't have yet.
#
# Browse it with shared_tools/list_tool_catalog.py (keyword/category search —
# small local models should never have to load this whole file into context).
# Install an entry onto an agent with shared_tools/install_catalog_tool.py,
# which reads this file so the calling agent only has to name the tool and
# the target agent, not invent a JSON schema from scratch.
#
# Entry fields:
#   name                snake_case tool name, unique across the catalog
#   category            groups entries for browsing; see `categories` below
#   status              "implemented" — a working module in shared_tools/,
#                       ready to register as-is once any listed credentials
#                       are configured; or "scaffold" — schema + beliefs
#                       only, install_catalog_tool.py generates a stub
#                       ("NOT YET IMPLEMENTED") body for a developer or Zoe
#                       to fill in, same as design_tool_subagent.py does.
#   module              implemented tools only: absolute path to the shared
#                       module (registered directly, same file, in every
#                       target agent's capabilities.yaml — the browse_files
#                       pattern).
#   description         one sentence; becomes the tool's TOOL_DEFINITION
#                       description.
#   parameters          JSON-Schema "properties" object.
#   required            list of required parameter names.
#   suggested_domain    capability domain name to register the tool under.
#   domain_description  used only if that domain doesn't exist yet on the
#                       target agent.
#   seed_beliefs        1-3 how-to-use beliefs seeded into the target's
#                       belief store on install — the raw material the
#                       ToolSubagent layer turns into that specialist's
#                       system prompt.
#   credentials_env     env vars the office must set to activate; empty list
#                       if the tool needs none.

categories:
  calendar_scheduling: {label: "Calendar & Scheduling"}
  web_research: {label: "Web Research & Browsing"}
  voice_audio: {label: "Voice: TTS / STT"}
  communication_messaging: {label: "Communication & Messaging"}
  document_processing: {label: "Document Processing"}
  crm_client_management: {label: "CRM & Client Management"}
  finance_billing: {label: "Finance & Billing"}
  e_signature_legal: {label: "E-Signature & Legal Filing"}
  cloud_storage: {label: "Cloud Storage"}
  maps_navigation: {label: "Maps & Navigation"}
  productivity_utilities: {label: "Productivity Utilities"}
  devops_system: {label: "DevOps & System"}
  data_analysis: {label: "Data Analysis"}
  image_media: {label: "Image & Media"}
  social_research: {label: "Social & News Monitoring"}

tools:

  # ---------------------------------------------------------- implemented
  - name: google_calendar
    category: calendar_scheduling
    status: implemented
    module: shared_tools/google_calendar.py
    description: Lists, creates, updates, or deletes events on the connected Google Calendar.
    parameters:
      action: {type: string, enum: [list_events, create_event, update_event, delete_event]}
      summary: {type: string, description: "Event title."}
      description: {type: string, description: "Event notes."}
      start_datetime: {type: string, description: "ISO 8601 start time."}
      end_datetime: {type: string, description: "ISO 8601 end time."}
      timezone: {type: string, description: "IANA timezone name."}
      attendees: {type: array, items: {type: string}}
      event_id: {type: string}
      time_min: {type: string}
      time_max: {type: string}
      max_results: {type: integer}
    required: [action]
    suggested_domain: calendar
    domain_description: "Manage the office Google Calendar: hearings, deadlines, and appointments."
    seed_beliefs:
      - "google_calendar needs GOOGLE_CALENDAR_ACCESS_TOKEN set in the environment before any call will work; if a call fails with 'not connected', that's a setup gap to flag, not a retry-worthy error."
      - "create_event needs summary and start_datetime at minimum; end_datetime defaults to start + 1 hour if omitted."
    credentials_env: [GOOGLE_CALENDAR_ACCESS_TOKEN, GOOGLE_CALENDAR_ID]

  - name: web_search
    category: web_research
    status: implemented
    module: shared_tools/web_search.py
    description: Searches the public web and returns titles, URLs, and snippets for a query.
    parameters:
      query: {type: string}
      max_results: {type: integer}
    required: [query]
    suggested_domain: web_research
    domain_description: "Search and read the open web to answer questions the local file library can't."
    seed_beliefs:
      - "web_search works with no setup via a best-effort DuckDuckGo fallback, but that path is anti-bot-gated and can fail intermittently; BRAVE_SEARCH_API_KEY or SERPAPI_KEY makes it reliable."
      - "Follow a promising web_search result with web_fetch on its URL to read the actual page instead of trusting the snippet alone."
    credentials_env: [BRAVE_SEARCH_API_KEY, SERPAPI_KEY]

  - name: web_fetch
    category: web_research
    status: implemented
    module: shared_tools/web_fetch.py
    description: Fetches a web page by URL and returns its readable text with HTML stripped out.
    parameters:
      url: {type: string}
      max_chars: {type: integer}
    required: [url]
    suggested_domain: web_research
    domain_description: "Search and read the open web to answer questions the local file library can't."
    seed_beliefs:
      - "web_fetch has no JS renderer; JS-heavy pages come back thin. If that happens, look for the page's underlying data/API URL instead."
    credentials_env: []

  - name: text_to_speech
    category: voice_audio
    status: implemented
    module: shared_tools/text_to_speech.py
    description: Synthesizes speech audio from text and writes it to a .wav file.
    parameters:
      text: {type: string}
      output_path: {type: string}
      voice: {type: string}
    required: [text]
    suggested_domain: voice_intake
    domain_description: "Transcribe dictated client intake and read back drafted text as speech."
    seed_beliefs:
      - "text_to_speech needs either a local synthesizer binary (espeak-ng) installed or TTS_API_URL configured; without either it returns a clear not-configured message rather than a file."
    credentials_env: [TTS_API_URL, TTS_API_KEY]

  - name: speech_to_text
    category: voice_audio
    status: implemented
    module: shared_tools/speech_to_text.py
    description: Transcribes an audio file to text.
    parameters:
      audio_path: {type: string}
    required: [audio_path]
    suggested_domain: voice_intake
    domain_description: "Transcribe dictated client intake and read back drafted text as speech."
    seed_beliefs:
      - "speech_to_text needs ffmpeg on PATH plus either WHISPER_CPP_BIN+WHISPER_CPP_MODEL or STT_API_URL configured; check the returned message for which is missing before retrying."
    credentials_env: [WHISPER_CPP_BIN, WHISPER_CPP_MODEL, STT_API_URL, STT_API_KEY]

  - name: calculator
    category: productivity_utilities
