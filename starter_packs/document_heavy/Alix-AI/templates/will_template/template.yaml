name: "Last Will and Testament Template"
description: "Legal Will and Testament document template with Jinja2 placeholders and Table of Contents (TOC)."
fields:
  client_name: "Full legal name of the testator"
  county: "County of residence"
  spouse_name: "Full legal name of spouse"
  num_children: "Number of children (e.g., 'two (2)')"
  children_names: "Names of children"
  mother_name: "Mother's legal name"
  father_name: "Father's legal name"
  num_siblings: "Number of siblings"
  sibling_names: "Names of siblings"
  num_nieces: "Number of nieces"
  num_nephews: "Number of nephews"
  nephew_names: "Names of nephews"
  vehicle_descriptions: "Vehicle and property descriptions"
  client_address: "Full residential address"
  client_phone: "Contact phone number"
default_format: "docx"
include_toc: true
