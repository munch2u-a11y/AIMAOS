domains:
  file_research:
    description: Explore local directories, search for files, and read documents to gather the information needed
      to plan.
    tools:
    - shared_tools/browse_files.py
    - Alix-AI/tools/search_files.py
    - Alix-AI/tools/list_files.py
    - Alix-AI/tools/read_document.py
  gateway:
    description: Triage incoming messages, check office status, and dispatch outbound packages for peers.
    tools:
    - Finn-AI/tools/triage_incoming.py
    - Finn-AI/tools/check_office_status.py
    - Finn-AI/tools/commandeer_channel.py
seed_beliefs:
- triage_incoming verifies the sender's real @-domain against the allowlist; spoofed suffixes stay UNVERIFIED and
  get NORMAL priority.
- commandeer_channel logs outbound packages; actual SMTP dispatch only happens when explicitly enabled, and the
  status in the log is the truth.
- "When a send is for a specific client's matter, pass client_name to commandeer_channel so a successful send is\
  \ also logged into that case's own activity log \u2014 the global outbound log records that something was sent,\
  \ but only the case's own record makes the case manager aware of it. Only applies when the client already has\
  \ a real case; commandeer_channel silently skips the case-log step otherwise rather than inventing one."
